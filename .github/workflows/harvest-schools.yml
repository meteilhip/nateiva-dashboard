name: Récolte écoles (OpenStreetMap)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Quoi récolter : schools (écoles), geo (villes & quartiers), all (les deux)"
        required: false
        default: "schools"
  schedule:
    # Écoles : le 1er février, puis le 1er de chaque mois jusqu'au 1er mai.
    # Villes & quartiers : UNE SEULE FOIS PAR AN, avec la récolte du 1er février.
    # (03h17 UTC ; lançable à la main via l'onglet Actions de GitHub.)
    - cron: '17 3 1 2-5 *'
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Choix de la récolte
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Villes & quartiers seulement en février (1 fois par an) ; écoles chaque mois.
            if [ "$(date -u +%m)" = "02" ]; then echo "target=all" >> "$GITHUB_OUTPUT"; else echo "target=schools" >> "$GITHUB_OUTPUT"; fi
          else
            echo "target=${{ github.event.inputs.target || 'schools' }}" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/harvest-schools.js
        env:
          TARGET: ${{ steps.pick.outputs.target }}
      - name: Commit du répertoire
        run: |
          git config user.name "nateiva-harvest-bot"
          git config user.email "noreply@nateiva.com"
          git add nateiva-schools-directory.generated.js nateiva-geo.generated.js
          git diff --cached --quiet || git commit -m "Répertoire écoles/quartiers: récolte OpenStreetMap automatique"
          git pull --rebase origin main || true
          git push
